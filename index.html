<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pitelicik — веб-разработка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #08080d;
            --bg-soft: #0e0e18;
            --card: #121220;
            --text: #f5f5fa;
            --muted: #7a7a8c;
            --violet: #8b5cf6;
            --violet-light: #a78bfa;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --border: rgba(139,92,246,0.15);
            --border-soft: rgba(255,255,255,0.06);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ХЕДЕР */
        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 16px 20px;
            background: rgba(8,8,13,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }
        .nav {
            display: none;
            gap: 24px;
            font-size: 12px;
            font-weight: 500;
        }
        .nav a {
            color: var(--muted);
            text-decoration: none;
        }
        .nav a:hover { color: var(--violet-light); }
        .header-btn {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
        }

        /* HERO */
        .hero {
            padding: 80px 20px 60px;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }
        .hero-avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--violet), var(--pink));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }
        .hero-eyebrow {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--violet-light);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 22px;
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(34px, 9vw, 62px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.05;
            margin-bottom: 22px;
            color: #fff;
        }
        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--violet-light) 0%, var(--pink) 50%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero h1 .italic {
            font-style: italic;
            font-weight: 300;
            color: var(--muted);
        }
        .hero-desc {
            font-size: clamp(14px, 3.5vw, 16px);
            color: var(--muted);
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto 32px;
        }
        .hero-actions {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid var(--border);
            padding: 15px 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-outline:hover {
            border-color: var(--violet);
            color: var(--violet-light);
        }
        .hero-meta {
            display: flex; justify-content: center; gap: 24px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-wrap: wrap;
        }
        .hero-meta span {
            display: flex; align-items: center; gap: 6px;
        }
        .hero-meta .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--violet);
        }

        /* Бегущая строка */
        .marquee-wrap {
            padding: 24px 20px;
            border-top: 1px solid var(--border-soft);
            border-bottom: 1px solid var(--border-soft);
            margin: 20px 0 0;
        }
        .marquee {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .marquee span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .marquee span::before {
            content: '◆ ';
            color: var(--violet);
        }

        /* СЕКЦИИ */
        .section {
            padding: 70px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .section-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--violet-light);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 18px;
        }
        .section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 6.5vw, 44px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
            color: #fff;
        }
        .section h2 .gradient {
            background: linear-gradient(135deg, var(--violet-light) 0%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-desc {
            font-size: 14px;
            line-height: 1.7;
            color: var(--muted);
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* УСЛУГИ */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .service-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 28px 24px;
        }
        .service-card:hover { border-color: var(--border); }
        .service-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, rgba(139,92,246,0.2) 0%, rgba(236,72,153,0.15) 100%);
            border: 1px solid var(--border);
        }
        .service-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .service-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--muted);
        }
        .service-list {
            list-style: none;
            margin-top: 14px;
        }
        .service-list li {
            font-size: 12px;
            color: var(--muted);
            padding: 3px 0;
            padding-left: 16px;
            position: relative;
        }
        .service-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--violet);
            font-size: 7px;
            top: 7px;
        }

        /* РАБОТЫ */
        .works-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .work-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
        }
        .work-card:hover { border-color: var(--border); }
        .work-preview {
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .work-preview-mockup {
            width: 70%;
            height: 65%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
        }
        .mockup-bar {
            display: flex; gap: 4px;
            margin-bottom: 10px;
        }
        .mockup-bar span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }
        .mockup-bar span:nth-child(1) { background: #ff5f57; }
        .mockup-bar span:nth-child(2) { background: #febc2e; }
        .mockup-bar span:nth-child(3) { background: #28c840; }
        .mockup-line {
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            margin-bottom: 6px;
        }
        .mockup-line.short { width: 60%; }
        .mockup-line.tiny { width: 40%; }
        .mockup-block {
            height: 40px;
            background: linear-gradient(135deg, rgba(139,92,246,0.4) 0%, rgba(236,72,153,0.3) 100%);
            border-radius: 6px;
            margin-top: 10px;
        }
        .work-info { padding: 20px; }
        .work-category {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--violet-light);
            margin-bottom: 8px;
        }
        .work-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .work-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .work-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .work-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            background: rgba(139,92,246,0.1);
            color: var(--violet-light);
            border: 1px solid var(--border);
        }

        /* ПРОЦЕСС */
        .process-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .process-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 24px 22px;
        }
        .process-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            color: var(--violet-light);
            margin-bottom: 14px;
        }
        .process-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .process-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* СТАТИСТИКА */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 24px 20px;
            text-align: center;
        }
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ЦЕНЫ */
        .pricing-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .price-card {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 30px 24px;
            position: relative;
        }
        .price-card.featured {
            border-color: var(--violet);
        }
        .price-badge {
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--violet), var(--pink));
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 5px 14px;
            border-radius: 100px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .price-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .price-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--violet-light);
            margin-bottom: 6px;
            letter-spacing: -1px;
        }
        .price-value small {
            font-size: 14px;
            color: var(--muted);
            font-weight: 400;
        }
        .price-desc {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .price-list {
            list-style: none;
            margin-bottom: 24px;
        }
        .price-list li {
            font-size: 13px;
            color: var(--text);
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            border-bottom: 1px solid var(--border-soft);
        }
        .price-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--violet);
            font-size: 8px;
            top: 12px;
        }
        .price-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--border);
            color: #fff;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 100px;
        }
        .price-btn:hover {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            border-color: transparent;
        }
        .price-card.featured .price-btn {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            border-color: transparent;
        }

        /* FAQ */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
        }
        .faq-item {
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            overflow: hidden;
        }
        .faq-item:hover { border-color: var(--border); }
        .faq-q {
            padding: 20px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .faq-q::after {
            content: '+';
            font-size: 22px;
            color: var(--violet-light);
            font-weight: 300;
        }
        .faq-item.open .faq-q::after { content: '−'; }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            padding: 0 22px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            transition: all 0.3s;
        }
        .faq-item.open .faq-a {
            max-height: 300px;
            padding: 0 22px 20px;
        }

        /* CTA */
        .cta {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .cta-box {
            background: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(236,72,153,0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 50px 24px;
            text-align: center;
        }
        .cta h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 14px;
            color: #fff;
        }
        .cta p {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 28px;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ФУТЕР */
        .footer {
            padding: 40px 20px 60px;
            text-align: center;
            border-top: 1px solid var(--border-soft);
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
        }
        .footer-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--violet-light);
            margin-bottom: 8px;
        }

        /* АДАПТИВ */
        @media (min-width: 640px) {
            .services-grid { grid-template-columns: repeat(2, 1fr); }
            .process-grid { grid-template-columns: repeat(2, 1fr); }
            .works-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-row { grid-template-columns: repeat(4, 1fr); }
        }
        @media (min-width: 900px) {
            .nav { display: flex; }
